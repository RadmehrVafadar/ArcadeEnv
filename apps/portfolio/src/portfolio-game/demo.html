<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Showcase scene demo</title>
  <link rel="stylesheet" href="../assets/fonts/game-font.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div class="demo-shell">
    <header class="demo-header">
      <div class="demo-title"><h1>Showcase scene demo</h1><a class="original-link" href="./game.html">Original game</a></div>
      <div class="demo-toolbar" aria-label="Demo tools">
        <button id="geometry" type="button" aria-pressed="false">Geometry</button>
        <button id="edit" type="button" aria-pressed="false">Move exhibits</button>
        <button id="reset" type="button">Reset scene</button>
      </div>
      <p class="demo-instructions">Walk with arrows / WASD or the D-pad. Space reads; E opens. The door exits.</p>
    </header>
    <main class="demo-play">
      <div class="demo-camera" aria-label="Showcase room">
        <div class="demo-world">
          <div class="demo-player" facing="down" walking="false" aria-label="Player">
            <div class="demo-spritesheet"></div>
          </div>
          <div class="demo-geometry" aria-hidden="true"></div>
        </div>
        <p class="demo-status" role="status">Loading scene...</p>
        <div class="demo-message" hidden><p></p><button type="button" aria-label="Close exhibit text">Close</button></div>
      </div>
      <div class="demo-controls" aria-label="Game controls">
        <div class="demo-dpad">
          <button type="button" data-direction="up" aria-label="Move up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 3 16h18Z"/></svg></button>
          <button type="button" data-direction="left" aria-label="Move left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 12 9V3Z"/></svg></button>
          <button type="button" data-direction="down" aria-label="Move down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 20 9-12H3Z"/></svg></button>
          <button type="button" data-direction="right" aria-label="Move right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20 12-12 9V3Z"/></svg></button>
        </div>
        <div class="demo-actions">
          <button type="button" id="read">Space<span>Read</span></button>
          <button type="button" id="open">E<span>Open</span></button>
        </div>
        <p class="demo-legend" hidden>Red: solid<br>Cyan: interaction<br>Yellow: player</p>
      </div>
    </main>
  </div>
  <script type="module" src="./demo.js"></script>
</body>
</html>
