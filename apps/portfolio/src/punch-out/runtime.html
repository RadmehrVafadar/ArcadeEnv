<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Punch-Out emulator</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
      body { display: grid; place-items: center; }
      #emulator { position: relative !important; width: min(100vw, 133.3333vh) !important; height: min(100vh, 75vw) !important; margin: 0 !important; }
      .ejs_canvas_parent { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; margin: 0 !important; background: #000; overflow: hidden; }
      #emulator > :not(.ejs_canvas_parent), .ejs_canvas_parent > :not(canvas) { display: none !important; }
      canvas { width: 100% !important; height: 100% !important; object-fit: contain; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="emulator"></div>
    <script type="module" src="./runtime.ts"></script>
  </body>
</html>
