<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mike Tyson's Punch-Out!!</title>
    <link rel="stylesheet" href="./punch-out.css">
  </head>
  <body data-state="loading" tabindex="-1">
    <main id="viewport" aria-label="Punch-Out game viewport"></main>
    <section id="instructions" aria-labelledby="game-title">
      <h1 id="game-title">Mike Tyson's<br>Punch-Out!!</h1>
      <dl>
        <div><dt>Return</dt><dd>Hold Start/Q (3s)</dd></div>
        <div><dt>Move &amp; dodge</dt><dd>Joystick</dd></div>
        <div><dt>Select</dt><dd>z + x</dd></div>
        <div><dt>Start</dt><dd>Q</dd></div>
        <div><dt>Pause</dt><dd>Esc / P</dd></div>
      </dl>
      <p id="status" role="status" aria-live="polite">Loading the ring...</p>
      <p id="resume-hint">Esc, P or tap Start to resume</p>
    </section>
    <script type="module" src="./punch-out.ts"></script>
  </body>
</html>
