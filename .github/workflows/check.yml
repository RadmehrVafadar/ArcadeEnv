name: Checks

on: pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build both apps
        run: npm run build
      - name: Run unit tests
        run: |
          node --test tests/launcher.test.mjs
          npm run test --workspace=portfolio-website
      - name: Run browser tests without WebGL
        run: npm run test:browser -- --grep-invert @webgl --output test-results/portfolio
      - name: Run WebGL browser tests serially
        run: npm run test:browser -- --grep @webgl --workers=1 --output test-results/webgl
      - name: Upload browser failure screenshots and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
